name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/test.yml

  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
