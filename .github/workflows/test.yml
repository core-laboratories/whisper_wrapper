name: Test

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test example/lib
      - run: flutter analyze
      - run: flutter test
      # Flutter may migrate analysis option files while validating an older
      # example project. Do not let generated migrations dirty the package.
      - run: git restore analysis_options.yaml example/analysis_options.yaml
      - run: flutter pub publish --dry-run

  native-build:
    name: Native build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macOS
            command: flutter build macos --debug
          - os: ubuntu-latest
            platform: Linux
            command: flutter build linux --debug
          - os: windows-latest
            platform: Windows
            command: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake ninja-build pkg-config libgtk-3-dev libjson-glib-dev liblzma-dev
        working-directory: .
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: ${{ matrix.command }}

  android-build:
    name: Native build (Android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Accept Android SDK licenses and install the NDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "ndk;29.0.13113456"
        working-directory: .
      - run: flutter pub get
      - run: flutter build apk --debug
