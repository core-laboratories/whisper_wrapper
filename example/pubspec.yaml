name: example
description: "Whisper Wrapper example"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Audio recorder
  record: ^7.1.1
  # Get local path
  path_provider: ^2.1.3
  # Whisper model
  whisper_wrapper:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
